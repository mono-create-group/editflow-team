    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.topbar-in{max-width:1060px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:12px}.brand{font-weight:850;letter-spacing:-.02em}.brand small{display:block;font-size:10px;font-weight:650;color:var(--t3);letter-spacing:.04em}.who{margin-left:auto;min-width:0;text-align:right}.who b,.who span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who span{font-size:10px;color:var(--t3)}main{max-width:1060px;margin:auto;padding:18px 18px 64px}.nav{display:flex;gap:7px;overflow:auto;padding:2px 0 14px}.btn{min-height:44px;border:1px solid var(--border);border-radius:9px;padding:9px 14px;background:var(--card);color:var(--text);font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}.btn:hover{border-color:#c9c5dc}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.btn.danger{color:var(--red);border-color:#fecaca}.btn.small{min-height:36px;padding:6px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.nav .btn{white-space:nowrap}.nav .active{background:var(--purple2);border-color:#c4b5fd;color:#5b21b6}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 12px}.page-head h1{font-size:21px;letter-spacing:-.025em;margin:0}.page-head p{font-size:12px;color:var(--t2);margin:2px 0 0}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}.metric{grid-column:span 3}.metric span{font-size:11px;color:var(--t3);font-weight:650}.metric b{display:block;font-size:25px;line-height:1.15;margin-top:5px}.section{margin-top:18px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}.section-title h2{font-size:15px;margin:0}.section-title span{font-size:11px;color:var(--t3)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{min-width:0}.field.full{grid-column:1/-1}.field label,.label{display:block;font-size:11px;font-weight:750;color:var(--t2);margin-bottom:4px}.field input,.field select,.field textarea,.control{width:100%;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.control:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(124,58,237,.10)}.field textarea{min-height:84px;resize:vertical}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:11px}.notice{border-left:3px solid var(--purple);background:var(--purple2)}.notice.warn{border-left-color:var(--amber);background:var(--amber2)}.notice.danger{border-left-color:var(--red);background:var(--red2)}.muted{font-size:11px;color:var(--t3)}.job-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.job-card{position:relative}.job-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.job-title{font-weight:800}.job-meta{font-size:11px;color:var(--t3);margin-top:3px}.pill{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:3px 8px;background:var(--card2);color:var(--t2);font-size:10px;font-weight:750;white-space:nowrap}.pill.green{background:var(--green2);color:#047857}.pill.red{background:var(--red2);color:#b91c1c}.pill.amber{background:var(--amber2);color:#92400e}.job-body{font-size:12px;color:var(--t2);margin:10px 0;white-space:pre-wrap}.link-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.safe-link{font-size:11px;color:#5b21b6;text-decoration:underline}.invoice-card{margin-bottom:9px}.invoice-total{font-size:20px;font-weight:850;margin:7px 0}.invoice-lines{font-size:11px;color:var(--t2);margin:7px 0}.empty{text-align:center;padding:32px 15px;color:var(--t3)}.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:10px}.check{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2)}.check input{margin-top:3px}.toast{position:fixed;left:50%;bottom:24px;z-index:100;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#191820;color:#fff;border-radius:9px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:.2s;max-width:min(92vw,520px);font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;margin:6px auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
    .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 14px;padding:0;list-style:none}.flow li{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:11px;color:var(--t2)}.flow b{display:block;color:var(--purple);font-size:10px}.job-detail{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}.job-detail summary{cursor:pointer;color:#5b21b6;font-weight:800;font-size:12px;padding:5px 0;list-style:none}.job-detail summary::-webkit-details-marker{display:none}.job-detail summary:after{content:'＋';float:right}.job-detail[open] summary:after{content:'−'}.schedule-summary{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.date-chip{background:var(--card2);border-radius:7px;padding:4px 7px;font-size:10px;color:var(--t2)}.job-primary{min-height:46px}.optional-box{grid-column:1/-1;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--card2)}.optional-box summary{cursor:pointer;font-size:11px;font-weight:800;color:var(--t2)}
    .guide-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#24104f,#4c1d95 60%,#1d4ed8);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 12px 30px rgba(76,29,149,.2)}.guide-hero:after{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(255,255,255,.18);border-radius:50%;right:-45px;top:-65px;box-shadow:0 0 0 28px rgba(255,255,255,.05)}.guide-kicker{font-size:9px;font-weight:850;letter-spacing:.14em;opacity:.7}.guide-hero h1{position:relative;z-index:1;font-size:23px;line-height:1.35;margin:5px 0}.guide-hero p{position:relative;z-index:1;max-width:650px;font-size:12px;line-height:1.75;color:rgba(255,255,255,.82);margin:0}.guide-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.guide-map .card{display:flex;flex-direction:column;border-top:3px solid var(--purple)}.guide-map h2{font-size:14px;margin:0 0 4px}.guide-map p,.guide-map ol{font-size:11px;color:var(--t2);margin:0 0 10px;flex:1}.guide-map ol{padding-left:20px;line-height:1.75}.guide-map li{margin:3px 0}.guide-faq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.guide-faq .card{box-shadow:none}.guide-faq b{display:block;font-size:12px;margin-bottom:3px}.guide-faq span{display:block;font-size:11px;color:var(--t2);line-height:1.65}.guide-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.guide-detail{border-left:4px solid var(--purple)}.guide-detail h2{font-size:14px;margin:0 0 7px}.guide-detail ol,.guide-detail ul{margin:0;padding-left:20px;font-size:11.5px;color:var(--t2);line-height:1.75}.guide-detail li{margin:4px 0}.guide-done{margin-top:10px;padding:9px 10px;background:var(--green2);border-radius:8px;color:#047857;font-size:11px;line-height:1.6}.guide-done b{display:block;font-size:10px}.guide-warning{margin-top:10px;padding:9px 10px;background:var(--amber2);border-radius:8px;color:#92400e;font-size:11px;line-height:1.6}.guide-status-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.guide-arrow{font-size:10px;color:var(--t3)}
    @media(max-width:760px){.metric{grid-column:span 6}.job-list,.split,.guide-map,.guide-faq,.guide-detail-grid{grid-template-columns:1fr}.topbar-in,main{padding-left:12px;padding-right:12px}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full,.optional-box{grid-column:auto}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.job-primary{width:100%}}
    @media(max-width:420px){.metric{grid-column:span 12}.who{max-width:46%}.btn{width:100%}.nav .btn,.actions .btn,.topbar .btn{width:auto}.actions .job-primary{width:100%}}
  </style>
</head>
<body>
  <div class="shell"><header class="topbar"><div class="topbar-in"><div class="brand">mono.create<small>EDITOR PORTAL</small></div><div id="account" class="who"></div><button id="logout-btn" class="btn small" type="button" onclick="logout()" hidden>サインアウト</button></div></header><main id="app"><div class="card empty"><div class="spinner"></div>読み込み中です</div></main></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Fixed versions: the PDF is made from the browser-rendered Japanese invoice, then saved as a PDF. -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
  <script>
  const DEMO=new URLSearchParams(location.search).get('demo')==='editor';
  const FIREBASE_CONFIG={apiKey:'AIzaSyA8kjyY8xF4usk5K7TyBfab_wW3EIFr9Z4',authDomain:'editflow-mono-create.firebaseapp.com',projectId:'editflow-mono-create',appId:'1:280142126082:web:3defcc1b0d370b14781b1b'};
  const GOOGLE_CLIENT_ID='280142126082-6nar25qaki0im5fgu42u6uibn15lsd8m.apps.googleusercontent.com';
  const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
  const OWNER_EMAILS=['mono.create.group@gmail.com','nakamurakouta512@gmail.com'];
  const HAKEN_STATUSES=['案件掲載中','募集中','編集者決定','受注済み','進行中','初稿提出済み','修正中','修正稿提出済み','D確認OK','完了','キャンセル','初稿完成','確認待ち'];
  const EDITOR_STATUSES=['受注済み','進行中','初稿提出済み','修正中','修正稿提出済み','D確認OK','完了','キャンセル','初稿完成','確認待ち'];
  const EDITOR_MILESTONE_DEFS=[
    {key:'initial_submitted',status:'初稿提出済み',label:'初稿を提出'},
    {key:'revision_submitted',status:'修正稿提出済み',label:'修正稿を提出'},
    {key:'director_approved',status:'D確認OK',label:'DのOK'},
    {key:'client_approved_delivered',status:'完了',label:'クライアントOK・納品'}
  ];
  const EDITOR_MILESTONE_BY_STATUS=Object.fromEntries(EDITOR_MILESTONE_DEFS.map(x=>[x.status,x]));
  const INVOICE_FINAL=['提出済み','再提出','承認済み','支払処理中','支払済み'];
  const $=s=>document.querySelector(s);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=v=>Number(v||0).toLocaleString('ja-JP');
  const id=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
  const now=()=>Date.now();
  const localDate=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const safeUrl=v=>{try{const u=new URL(v);return['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return''}};
  let auth=null,db=null,user=null,access=null,profile={},jobs=[],invoices=[],authorizations=[],view='dashboard',unsubs=[],portalUnsubs=[],driveToken=null,driveClient=null,driveContinuation=null,invoiceMonth=new Date().toISOString().slice(0,7),invoiceDue='',pdfBuilding=false;
  const draftKey=()=>`mc_editor_case_draft_${user?.uid||'anon'}`;

  function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
  function accountHtml(){const el=$('#account');if(!el)return;el.innerHTML=user?`<b>${esc(access?.name||user.displayName||'編集者')}</b><span>${esc(user.email||'')}</span>`:'';$('#logout-btn').hidden=!user}
  function navHtml(){return`<nav class="nav" aria-label="編集者メニュー">${[['guide','使い方ガイド'],['dashboard','概要'],['jobs','担当案件'],['invoices','請求書'],['settings','請求者設定']].map(([k,l])=>`<button type="button" class="btn ${view===k?'active':''}" onclick="setView('${k}')">${l}</button>`).join('')}</nav>`}
  function setView(v){view=v;render()}
  function pageHead(title,sub){return`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div></div>`}
  function statusPill(status){const cls=['完了','D確認OK'].includes(status)?'green':status==='キャンセル'?'red':['初稿提出済み','修正稿提出済み','確認待ち','修正中'].includes(status)?'amber':'';return`<span class="pill ${cls}">${esc(status||'未設定')}</span>`}
  function tsValue(v){return v&&typeof v.toMillis==='function'?v.toMillis():Number(v||0)}
  function sortNewest(list){return[...list].sort((a,b)=>(tsValue(b.updatedAt)||tsValue(b.createdAt))-(tsValue(a.updatedAt)||tsValue(a.createdAt)))}
  function jobDelivery(j){return j?.deliveryDate||j?.deadline||''}
  function jobSchedule(j={}){return{sharedDate:j.sharedDate||'',editorDraftDate:j.editorDraftDate||'',clientDraftDate:j.clientDraftDate||'',thumbnailDate:j.thumbnailDate||'',deliveryDate:jobDelivery(j)}}
  function scheduleError(s){const ordered=[s.sharedDate,s.editorDraftDate,s.clientDraftDate,s.deliveryDate].filter(Boolean);for(let i=1;i<ordered.length;i++)if(ordered[i]<ordered[i-1])return'日程は「受注日 → 編集者初稿 → クライアント提出初稿 → 納品日」の順で入力してください';if(s.thumbnailDate&&s.deliveryDate&&s.thumbnailDate>s.deliveryDate)return'サムネイル納品日は案件の納品日以前に設定してください';return''}
  function jobDraftKey(jid){return`mc_editor_job_draft_${user?.uid||'anon'}_${jid}`}
  function readJobDraft(jid){try{return JSON.parse(sessionStorage.getItem(jobDraftKey(jid))||'{}')}catch(_){return{}}}
  function clearJobDraft(jid){try{sessionStorage.removeItem(jobDraftKey(jid))}catch(_){}}
  function saveJobDraft(jid){const d={status:$('#job-status-'+jid)?.value||'',sharedDate:$('#job-shared-'+jid)?.value||'',editorDraftDate:$('#job-editor-draft-'+jid)?.value||'',clientDraftDate:$('#job-client-draft-'+jid)?.value||'',thumbnailDate:$('#job-thumbnail-'+jid)?.value||'',deliveryDate:$('#job-delivery-'+jid)?.value||'',workDate:$('#job-workdate-'+jid)?.value||'',startTime:$('#job-start-'+jid)?.value||'',endTime:$('#job-end-'+jid)?.value||'',progress:$('#job-progress-'+jid)?.value||'',evidenceUrl:$('#job-evidence-'+jid)?.value||'',blocker:$('#job-blocker-'+jid)?.value||''};try{sessionStorage.setItem(jobDraftKey(jid),JSON.stringify(d))}catch(_){}}
  function nextJobAction(status){return{受注済み:['進行中','作業を開始'],進行中:['初稿提出済み','初稿を提出した'],初稿完成:['初稿提出済み','初稿を提出した'],修正中:['修正稿提出済み','修正稿を提出した'],初稿提出済み:['D確認OK','DのOKが出た'],修正稿提出済み:['D確認OK','DのOKが出た'],確認待ち:['D確認OK','DのOKが出た'],D確認OK:['完了','クライアントOK・納品完了']}[status]||null}
  function editorMilestonePanel(job){const done=new Set((Array.isArray(job?.progressMilestones)?job.progressMilestones:[]).map(x=>x?.key));return`<div class="card notice" style="box-shadow:none;margin:9px 0"><b>担当編集者が必ず更新する4つの進捗</b><div class="muted" style="margin:3px 0 8px">初稿提出・修正稿提出・D確認OK・クライアントOK／納品を、該当時点で本人が更新します。</div><div class="schedule-summary">${EDITOR_MILESTONE_DEFS.map(x=>`<span class="date-chip" style="${done.has(x.key)?'background:#ecfdf5;color:#047857;border-color:#a7f3d0':'background:#fff7ed;color:#9a3412;border-color:#fed7aa'}">${done.has(x.key)?'✓':'未'} ${esc(x.label)}</span>`).join('')}</div></div>`}
  function editorMilestoneError(previous,status,evidence){if(previous===status)return'';const allowed={初稿提出済み:['進行中','初稿完成'],修正稿提出済み:['修正中'],D確認OK:['初稿提出済み','修正稿提出済み','確認待ち'],完了:['D確認OK']};if(allowed[status]&&!allowed[status].includes(previous))return status==='完了'?'先に「DのOKが出た」を更新してください':`「${status}」へ進む前の進捗を確認してください`;if(['初稿提出済み','修正稿提出済み','完了'].includes(status)&&!evidence)return'初稿・修正稿・納品の提出時は証跡URLを登録してください';return''}
  function scheduleChips(j){const s=jobSchedule(j),items=[['受注',s.sharedDate],['編集者初稿',s.editorDraftDate],['クライアント提出',s.clientDraftDate],['サムネイル',s.thumbnailDate],['納品',s.deliveryDate]].filter(x=>x[1]);return items.map(([label,date])=>`<span class="date-chip">${label} ${esc(date)}</span>`).join('')}

  function loginScreen(){accountHtml();$('#app').innerHTML=`<div style="max-width:440px;margin:9vh auto"><div class="card"><div class="brand" style="font-size:22px">mono.create</div><h1 style="font-size:18px;margin:18px 0 4px">編集者ポータル</h1><p style="color:var(--t2);font-size:12px">担当案件とご自身の請求情報だけを表示します。</p><button class="btn primary" style="width:100%;margin-top:12px" type="button" onclick="googleLogin()">Googleでサインイン</button><p class="muted">初回は管理者の承認が必要です。</p></div></div>`}
  function pendingScreen(){accountHtml();$('#app').innerHTML=`${pageHead('アクセス承認待ち','安全な専用データだけを利用します')}<div class="card notice warn"><b>管理者に承認申請を送信しました</b><p style="font-size:12px;color:var(--t2);margin-bottom:0">承認後に再読み込みしてください。この画面は、社内の共有案件データや顧客請求額、原価、粗利を読み込みません。</p></div><div class="actions"><button class="btn" onclick="location.reload()">承認状態を再確認</button></div>`}
  function deniedScreen(){accountHtml();$('#app').innerHTML=`${pageHead('利用権限がありません','管理者に確認してください')}<div class="card notice danger">このアカウントに動画編集者の役割が設定されていません。</div>`}

  const JOB_OVERDUE_EXCLUDED_STATUSES=new Set(['完了','キャンセル','初稿提出済み','修正稿提出済み','D確認OK','確認待ち','修正中']);
  function isJobOverdue(job,baseDate=localDate()){const deliveryDate=jobDelivery(job);return!!(deliveryDate&&deliveryDate<baseDate&&!JOB_OVERDUE_EXCLUDED_STATUSES.has(job.status))}
  function dashboardHtml(){const active=jobs.filter(j=>!['完了','キャンセル'].includes(j.status)),overdue=active.filter(j=>isJobOverdue(j)),review=active.filter(j=>['初稿提出済み','修正稿提出済み','D確認OK','初稿完成','確認待ち','修正中'].includes(j.status)),payable=activeAuthorization(new Date().toISOString().slice(0,7))?.jobIds?.length||0;return`${pageHead('概要','今必要な対応を一画面で確認')}<div class="card notice" style="margin-bottom:10px"><b>初めて使う方へ</b><p class="muted">案件の受け方から請求書の提出まで、順番に確認できます。</p><button class="btn small" type="button" onclick="setView('guide')">使い方ガイドを開く</button></div><div class="grid"><div class="card metric"><span>進行中</span><b>${active.length}</b></div><div class="card metric"><span>期限超過</span><b style="color:var(--red)">${overdue.length}</b></div><div class="card metric"><span>確認・修正</span><b>${review.length}</b></div><div class="card metric"><span>今月の請求候補</span><b>${payable}</b></div></div><section class="section"><div class="section-title"><h2>優先対応</h2><span>期限と停止理由から抽出</span></div><div class="job-list">${sortNewest([...overdue,...active.filter(j=>j.blocker)].filter((j,i,a)=>a.findIndex(x=>x.id===j.id)===i)).slice(0,6).map(jobCard).join('')||'<div class="card empty">優先対応はありません</div>'}</div></section>`}

  function guideHtml(){return`<div class="guide-hero"><div class="guide-kicker">EDITOR WORK GUIDE</div><h1>初めての方のための編集者ガイド</h1><p>Chatworkは通知とこのアプリへの入口です。案件を受ける、日程を伝える、質問する、初稿・修正稿・納品を提出する、請求書を送る操作はすべてここで行います。</p></div>
  <div class="section-title"><h2>最初の1回だけすること</h2><span>所要目安5分</span></div><div class="guide-detail-grid"><section class="card guide-detail"><h2>1. ログイン承認</h2><ol><li>Chatworkの概要からこのアプリを開きます。</li><li>Googleでサインインします。</li><li>「アクセス承認待ち」と出たら、管理者の承認後に再読み込みします。</li></ol><div class="guide-done"><b>完了の目印</b>上部に「案件を探す」「担当案件」などのメニューが表示されます。</div></section><section class="card guide-detail"><h2>2. 請求者設定</h2><ol><li>「請求者設定」を開きます。</li><li>氏名、銀行、支店、口座番号、口座名義を入力します。</li><li>「設定を保存」を押します。</li></ol><div class="guide-warning">適格請求書発行事業者でない場合、登録番号は空欄のままで大丈夫です。</div><div class="actions"><button class="btn primary small" onclick="setView('settings')">請求者設定を開く</button></div></section></div>
  <div class="section-title"><h2>毎週月曜日にすること</h2><span>今週の1週間だけ</span></div><section class="card guide-detail"><h2>編集可能スケジュールを登録</h2><ol><li>「スケジュール」を開きます。</li><li>一括登録で対応可能な曜日を選び、時間・受託可能本数・案件種別を入れます。</li><li>毎週同じなら「毎週のルーティン」をオンにします。</li><li>「今週の1週間を保存」を押します。</li></ol><div class="guide-done"><b>完了の目印</b>今週の月曜日から日曜日のカレンダーに入力内容が残ります。</div><div class="guide-warning">他の編集者も見るため、通院・家族・私用などの理由は入力しません。</div><div class="actions"><button class="btn primary small" onclick="setView('schedule')">スケジュールを開く</button></div></section>
  <div class="section-title"><h2>案件を受ける2つの方法</h2></div><div class="guide-map"><section class="card"><h2>編集代行案件を受ける</h2><ol><li>社内アプリへログインします。</li><li>「案件を探す」を開きます。</li><li>案件内容・初稿日・納品日を確認します。</li><li>「この案件を受ける」を押します。</li><li>自動で開く「担当案件」に反映されたことを確認します。</li></ol><button class="btn primary small" onclick="setView('board')">案件を探す</button></section><section class="card"><h2>編集者派遣の案件を登録する</h2><p>派遣先クライアントから直接受けた案件は、「担当案件」の登録欄でクライアントとアカウントを選び、案件名・納品日・指示を入力します。選択肢がない場合は、管理者が共有するまで待ちます。</p><button class="btn primary small" onclick="setView('jobs')">担当案件を開く</button></section></div>
  <div class="section-title"><h2>案件を受けた後の順番</h2></div><section class="card guide-detail"><h2>作業開始から完了まで</h2><div class="guide-status-line"><span class="pill">受注済み</span><span class="guide-arrow">→</span><span class="pill">進行中</span><span class="guide-arrow">→</span><span class="pill amber">初稿提出済み</span><span class="guide-arrow">→</span><span class="pill amber">修正稿提出済み</span><span class="guide-arrow">→</span><span class="pill green">D確認OK</span><span class="guide-arrow">→</span><span class="pill green">完了</span></div><ol><li>案件を開き、納期・編集指示・素材URL・マニュアルを確認します。</li><li>分からない点は、案件内チャットの種類を「質問」にして送ります。</li><li>初稿を提出したら「初稿を提出した」を必ず押し、証跡URLを保存します。</li><li>修正稿を提出したら「修正稿を提出した」を必ず押し、証跡URLを更新します。</li><li>DのOKが出たら「DのOKが出た」を必ず押します。</li><li>クライアントのOKが出て納品したら「クライアントOK・納品完了」を必ず押します。</li></ol><div class="guide-done"><b>完了の目印</b>案件で発生した節目が「✓」になり、担当編集者本人の更新履歴と証跡URLが残っています。</div><div class="guide-warning">各節目は管理者ではなく、担当編集者本人が更新します。修正がなかった案件は「修正稿を提出」を未記録のままD確認OKへ進めます。確認中・修正中・提出済み・D確認OKは期限超過には数えません。</div></section>
  <div class="section-title"><h2>その他のページ</h2></div><div class="guide-detail-grid"><section class="card guide-detail"><h2>マニュアル</h2><ol><li>作業前に「必読」のマニュアルを開きます。</li><li>クライアントとアカウントが案件と一致しているか確認します。</li><li>読んだら「読了を記録」を押します。</li></ol><div class="actions"><button class="btn small" onclick="setView('manuals')">マニュアルを開く</button></div></section><section class="card guide-detail"><h2>匿名目安箱</h2><ol><li>種類を選び、状況と改善してほしい内容を書きます。</li><li>返信が必要なら返信コード発行をオンにします。</li><li>「匿名で送信」を押し、コードを保管します。</li></ol><div class="actions"><button class="btn small" onclick="setView('suggestion')">匿名目安箱を開く</button></div></section><section class="card guide-detail"><h2>請求書</h2><ol><li>案件完了後、管理者が報酬額と対象月を確定するまで待ちます。</li><li>請求対象月と支払期日を確認し、下書きを作成します。</li><li>プレビューで氏名・口座・明細・金額を確認します。</li><li>PDFをDrive保存し、「確定して提出」を押します。</li></ol><div class="guide-done"><b>完了の目印</b>請求書履歴の状態が「提出済み」になります。</div><div class="actions"><button class="btn primary small" onclick="setView('invoices')">請求書を開く</button></div></section></div>
  <div class="section-title"><h2>迷ったとき</h2></div><div class="guide-faq"><div class="card"><b>「システム更新」が届いた</b><span>入力中の内容を保存し、画面を再読み込みします。</span></div><div class="card"><b>案件が見つからない</b><span>「案件を探す」と「担当案件」の両方を確認します。ない場合は担当登録待ちです。</span></div><div class="card"><b>クライアントの選択肢がない</b><span>管理者が対象のクライアントとアカウントを共有すると表示されます。</span></div><div class="card"><b>初稿・修正稿を提出したい</b><span>案件内チャットで種類を選びURLを送信し、証跡URLにも保存します。</span></div><div class="card"><b>請求書が作れない</b><span>管理者の報酬確定後に作成できます。確定済みでも作れない場合は、請求者設定の必須項目を確認します。</span></div></div>`}
  function readCaseDraft(){try{return JSON.parse(sessionStorage.getItem(draftKey())||'{}')}catch(_){return{}}}
  function saveCaseDraft(){const d={title:$('#new-title')?.value||'',clientDisplay:$('#new-client')?.value||'',sharedDate:$('#new-shared')?.value||'',editorDraftDate:$('#new-editor-draft')?.value||'',clientDraftDate:$('#new-client-draft')?.value||'',thumbnailDate:$('#new-thumbnail')?.value||'',deliveryDate:$('#new-deadline')?.value||'',deadline:$('#new-deadline')?.value||'',requestUrl:$('#new-request')?.value||'',sourceUrl:$('#new-source')?.value||'',instructions:$('#new-instructions')?.value||'',urgent:!!$('#new-urgent')?.checked};try{sessionStorage.setItem(draftKey(),JSON.stringify(d))}catch(_){}}
  function jobForm(){const d=readCaseDraft(),sharedDate=Object.prototype.hasOwnProperty.call(d,'sharedDate')?d.sharedDate:localDate(),deliveryDate=d.deliveryDate||d.deadline||'';return`<div class="card"><div class="section-title"><h2>クライアントから直接受けた案件を登録</h2><span>入力内容は自動で一時保存</span></div><div class="form-grid" oninput="saveCaseDraft()" onchange="saveCaseDraft()"><div class="field"><label for="new-title">案件名 *</label><input id="new-title" maxlength="120" value="${esc(d.title||'')}" placeholder="例：8月ショート動画 03"></div><div class="field"><label for="new-client">クライアント表示名 *</label><input id="new-client" maxlength="80" value="${esc(d.clientDisplay||'')}"></div><div class="field"><label for="new-shared">受注日</label><input id="new-shared" type="date" value="${esc(sharedDate)}"></div><div class="field"><label for="new-deadline">納品日 *</label><input id="new-deadline" type="date" value="${esc(deliveryDate)}"></div><details class="optional-box"><summary>初稿日など詳しい日程を入力</summary><div class="form-grid" style="margin-top:8px"><div class="field"><label for="new-editor-draft">編集者 初稿</label><input id="new-editor-draft" type="date" value="${esc(d.editorDraftDate||'')}"></div><div class="field"><label for="new-client-draft">クライアント提出 初稿</label><input id="new-client-draft" type="date" value="${esc(d.clientDraftDate||'')}"></div><div class="field"><label for="new-thumbnail">サムネイル納品日</label><input id="new-thumbnail" type="date" value="${esc(d.thumbnailDate||'')}"></div></div></details><div class="field"><label class="check"><input id="new-urgent" type="checkbox" ${d.urgent?'checked':''}> 緊急案件として登録</label></div><div class="field"><label for="new-request">依頼内容URL</label><input id="new-request" type="url" value="${esc(d.requestUrl||'')}" placeholder="https://"></div><div class="field"><label for="new-source">素材URL</label><input id="new-source" type="url" value="${esc(d.sourceUrl||'')}" placeholder="https://"></div><div class="field full"><label for="new-instructions">依頼内容・編集指示 *</label><textarea id="new-instructions" maxlength="3000">${esc(d.instructions||'')}</textarea></div></div><div class="actions"><button class="btn primary job-primary" type="button" onclick="createJob()">この内容で案件を登録</button></div></div>`}
  function jobsHtml(){return`${pageHead('担当案件','直接入力と進捗更新をここで完結')}<ol class="flow"><li><b>STEP 1</b>案件を登録</li><li><b>STEP 2</b>日程を確認</li><li><b>STEP 3</b>証跡を登録</li><li><b>STEP 4</b>請求書を作成</li></ol>${jobForm()}<section class="section"><div class="section-title"><h2>案件一覧</h2><span>${jobs.length}件</span></div><div class="job-list">${sortNewest(jobs).map(jobCard).join('')||'<div class="card empty">担当案件はありません</div>'}</div></section>`}
  function jobCard(job){const j={...job,...readJobDraft(job.id)},deliveryDate=jobDelivery(j),overdue=isJobOverdue(j),r=safeUrl(j.requestUrl),s=safeUrl(j.sourceUrl),e=safeUrl(j.evidenceUrl),action=nextJobAction(j.status),statuses=[...new Set([j.status,...EDITOR_STATUSES])].filter(Boolean);return`<article class="card job-card ${overdue?'notice danger':''}"><div class="job-top"><div><div class="job-title">${esc(j.title)}</div><div class="job-meta">${esc(j.clientDisplay||'')} ・ 納品 ${esc(deliveryDate||'未設定')}${overdue?' ・ 期限超過':''}</div></div>${statusPill(j.status)}</div><div class="schedule-summary">${scheduleChips(j)}</div>${j.correctionReason?`<div class="card notice warn" style="box-shadow:none"><b>差戻し内容</b><div class="muted">${esc(j.correctionReason)}</div></div>`:''}${action?`<div class="actions"><button class="btn primary job-primary" type="button" onclick="quickJobStatus('${j.id}','${action[0]}')">${action[1]}</button></div>`:''}<details class="job-detail"><summary>日程・進捗・証跡を編集</summary>${j.instructions?`<div class="job-body">${esc(j.instructions)}</div>`:''}<div class="link-row">${r?`<a class="safe-link" target="_blank" rel="noopener" href="${esc(r)}">依頼内容</a>`:''}${s?`<a class="safe-link" target="_blank" rel="noopener" href="${esc(s)}">素材</a>`:''}${e?`<a class="safe-link" target="_blank" rel="noopener" href="${esc(e)}">証跡</a>`:''}</div><div class="form-grid" oninput="saveJobDraft('${j.id}')" onchange="saveJobDraft('${j.id}')"><div class="field"><label for="job-status-${j.id}">ステータス</label><select id="job-status-${j.id}">${statuses.map(x=>`<option ${x===j.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="job-shared-${j.id}">受注日</label><input id="job-shared-${j.id}" type="date" value="${esc(j.sharedDate||'')}"></div><div class="field"><label for="job-editor-draft-${j.id}">編集者 初稿</label><input id="job-editor-draft-${j.id}" type="date" value="${esc(j.editorDraftDate||'')}"></div><div class="field"><label for="job-client-draft-${j.id}">クライアント提出 初稿</label><input id="job-client-draft-${j.id}" type="date" value="${esc(j.clientDraftDate||'')}"></div><div class="field"><label for="job-thumbnail-${j.id}">サムネイル納品日</label><input id="job-thumbnail-${j.id}" type="date" value="${esc(j.thumbnailDate||'')}"></div><div class="field"><label for="job-delivery-${j.id}">納品日 *</label><input id="job-delivery-${j.id}" type="date" value="${esc(deliveryDate)}"></div><div class="field"><label for="job-workdate-${j.id}">作業日</label><input id="job-workdate-${j.id}" type="date" value="${esc(j.workDate||'')}"></div><div class="field"><label for="job-start-${j.id}">開始時刻</label><input id="job-start-${j.id}" type="time" value="${esc(j.startTime||'')}"></div><div class="field"><label for="job-end-${j.id}">終了時刻</label><input id="job-end-${j.id}" type="time" value="${esc(j.endTime||'')}"></div><div class="field full"><label for="job-progress-${j.id}">進捗メモ</label><textarea id="job-progress-${j.id}" maxlength="2000">${esc(j.progress||'')}</textarea></div><div class="field"><label for="job-evidence-${j.id}">納品・確認証跡URL</label><input id="job-evidence-${j.id}" type="url" value="${esc(j.evidenceUrl||'')}" placeholder="https://"></div><div class="field"><label for="job-blocker-${j.id}">停止理由</label><input id="job-blocker-${j.id}" maxlength="300" value="${esc(j.blocker||'')}"></div></div><div class="actions"><button class="btn primary job-primary" type="button" onclick="saveJobProgress('${j.id}')">変更を保存</button></div></details></article>`}

  function settingsHtml(){return`${pageHead('請求者設定','ご自身の請求書だけに使用')}<div class="split"><div class="card"><div class="form-grid"><div class="field"><label for="issuer-name">発行者名・屋号 *</label><input id="issuer-name" maxlength="100" value="${esc(profile.issuerName||access?.name||user?.displayName||'')}"></div><div class="field"><label for="registration">適格請求書発行事業者登録番号</label><input id="registration" maxlength="14" value="${esc(profile.registrationNumber||'')}" placeholder="T + 13桁の数字"><div class="muted" style="margin-top:4px;color:${profile.registrationVerified?'var(--green)':'var(--amber)'}">${profile.registrationNumber?(profile.registrationVerified?'✓ 管理者確認済み':'管理者確認待ち'):'未登録（通常の請求書として作成）'}</div></div><div class="field"><label for="tax-rate">適用税率</label><select id="tax-rate"><option value="0" ${Number(profile.taxRate||0)===0?'selected':''}>0%</option><option value="10" ${Number(profile.taxRate||0)===10?'selected':''}>10%</option></select></div><div class="field"><label>請求先</label><input disabled value="${esc(access?.invoiceRecipientName||'mono.create')}"></div><div class="field"><label for="bank-name">金融機関名 *</label><input id="bank-name" maxlength="60" value="${esc(profile.bankName||'')}"></div><div class="field"><label for="bank-branch">支店名 *</label><input id="bank-branch" maxlength="60" value="${esc(profile.bankBranch||'')}"></div><div class="field"><label for="bank-type">口座種別</label><select id="bank-type"><option ${profile.bankType==='普通'?'selected':''}>普通</option><option ${profile.bankType==='当座'?'selected':''}>当座</option></select></div><div class="field"><label for="bank-number">口座番号 *</label><input id="bank-number" inputmode="numeric" maxlength="12" value="${esc(profile.bankNumber||'')}"></div><div class="field full"><label for="bank-holder">口座名義（カナ） *</label><input id="bank-holder" maxlength="80" value="${esc(profile.bankHolder||'')}"></div></div><div class="actions"><button class="btn primary" type="button" onclick="saveProfile()">設定を保存</button></div></div><div><div class="card notice"><b>登録番号がない場合も請求できます</b><p class="muted">未登録・未確認の場合は「請求書（適格請求書ではありません）」として作成します。適格請求書の表示は管理者確認後だけ有効になります。</p></div><div class="card notice warn"><b>源泉徴収は自動確定しません</b><p class="muted">契約内容や成果物により判断が異なるため、管理者・会計担当の確認後に支払額が確定します。</p></div></div></div>`}
  function invoiceCreatePanel(){const authorization=activeAuthorization(invoiceMonth),count=authorization?.jobIds?.length||0;return`<div class="card"><div class="section-title"><h2>確定済み報酬から作成</h2><span>対象案件 ${count}件</span></div><div class="form-grid"><div class="field"><label for="invoice-month">請求対象月</label><input id="invoice-month" type="month" value="${invoiceMonth}" onchange="invoiceMonth=this.value;render()"></div><div class="field"><label for="invoice-due">支払期日</label><input id="invoice-due" type="date" value="${invoiceDue}" onchange="invoiceDue=this.value"></div></div>${authorization?`<div class="notice" style="margin-top:10px"><b>管理者確定額 ¥${money(authorization.total)}</b><div class="muted">承認番号 ${esc(authorization.id)} / revision ${Number(authorization.revision||0)}</div></div>`:'<div class="notice warn" style="margin-top:10px"><b>管理者の報酬確定待ちです</b><div class="muted">案件が完了後、管理者が金額と請求月を確定すると作成できます。</div></div>'}<div class="actions"><button class="btn primary" type="button" ${authorization?'':'disabled'} onclick="draftInvoice()">ワンタップで下書き作成</button></div><p class="muted">案件明細と金額は、管理者が発行した改ざん不可の承認データから作成します。</p></div>`}

        pdf.addImage(part.toDataURL('image/jpeg',0.96),'JPEG',10,10,pageWidthMm,(part.height/canvas.width)*pageWidthMm,undefined,'FAST');

      }
      return pdf.output('blob');
    }finally{frame.remove()}
  }
  function driveConnect(continuation){driveContinuation=continuation;if(DEMO)return continuation();if(driveToken)return continuation();if(typeof google==='undefined'||!google.accounts?.oauth2)return toast('Google Drive認証の読み込み中です');driveClient=driveClient||google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,callback:r=>{if(r.error){driveContinuation=null;return toast('Google Driveの接続がキャンセルされました')}driveToken=r.access_token;const next=driveContinuation;driveContinuation=null;if(next)next()}});driveClient.requestAccessToken({prompt:'consent select_account'})}
  async function hashBlob(blob){const b=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  async function uploadDrive(blob,name,mimeType){const meta={name,mimeType},form=new FormData();form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));form.append('file',blob,name);const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,mimeType,size,createdTime',{method:'POST',headers:{Authorization:'Bearer '+driveToken},body:form});if(!res.ok)throw new Error('upload '+res.status);const file=await res.json(),shared=[];for(const email of OWNER_EMAILS){if((user.email||'').toLowerCase()===email){shared.push(email);continue}try{const p=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}/permissions?sendNotificationEmail=false`,{method:'POST',headers:{Authorization:'Bearer '+driveToken,'Content-Type':'application/json'},body:JSON.stringify({type:'user',role:'reader',emailAddress:email})});if(p.ok)shared.push(email)}catch(_){}}return{file,shared}}
  async function persistInvoiceFile(x,blob,name,mimeType){try{const sha256=await hashBlob(blob),result=DEMO?{file:{id:'demo-drive-'+id(),webViewLink:'#demo',mimeType,size:blob.size,createdTime:new Date().toISOString()},shared:OWNER_EMAILS.slice(0,1)}:await uploadDrive(blob,name,mimeType),ownerShareStatus=result.shared.length?'shared':'needs_owner_access',data={file:{provider:'google-drive',id:result.file.id,webViewLink:result.file.webViewLink||'',name,mimeType,size:blob.size,sha256,createdTime:result.file.createdTime||'',uploadedAt:now(),uploadedByUid:user.uid,sharedWith:result.shared},ownerShareStatus,updatedAt:now()};if(DEMO){Object.assign(x,data);render();toast(ownerShareStatus==='shared'?'Drive原本を保存しました':'管理者共有に失敗しました');return}const ref=db.collection('editor_portals').doc(user.uid).collection('editor_invoices').doc(x.id),ev=ref.collection('events').doc(),batch=db.batch();batch.update(ref,data);batch.set(ev,{at:firebase.firestore.FieldValue.serverTimestamp(),byUid:user.uid,status:x.status,type:'file_saved',fileId:result.file.id,fileSha256:sha256});await batch.commit();toast(ownerShareStatus==='shared'?'Drive原本を保存しました':'Drive保存は完了しましたが、管理者共有に失敗しました')}catch(e){console.warn(e);driveToken=null;toast('Driveへ保存できませんでした。下書きは保持されています')}}
  async function saveGeneratedInvoice(iid){const x=invoices.find(v=>v.id===iid);if(!x||x.status!=='下書き'||pdfBuilding)return;pdfBuilding=true;toast('請求書PDFを作成しています…');try{const pdf=await generateInvoicePdf(x);driveConnect(()=>persistInvoiceFile(x,pdf,`${x.invoiceNumber}.pdf`,'application/pdf'))}catch(e){console.warn(e);toast('PDFを作成できませんでした。通信状態を確認して再度お試しください')}finally{pdfBuilding=false}}
  function uploadInvoiceFile(iid,input){const x=invoices.find(v=>v.id===iid),file=input.files?.[0];input.value='';if(!x||x.status!=='下書き'||!file)return;if(!['application/pdf','image/jpeg','image/png'].includes(file.type)||file.size>10*1024*1024)return toast('PDF/JPEG/PNG・10MB以下のファイルを選択してください');driveConnect(()=>persistInvoiceFile(x,file,`${x.invoiceNumber}-${file.name}`,file.type))}
  async function submitInvoice(iid){const x=invoices.find(v=>v.id===iid);if(!x||x.status!=='下書き'||!x.file?.id||x.ownerShareStatus!=='shared')return toast('Drive原本の保存と管理者共有を完了してください');if(!confirm('この内容で確定し、提出しますか？\n提出後は上書きできません。'))return;const at=now(),data={status:'提出済み',submittedAt:at,updatedAt:at};if(DEMO){Object.assign(x,data);render();return toast('請求書を提出しました')};try{const ref=db.collection('editor_portals').doc(user.uid).collection('editor_invoices').doc(iid),ev=ref.collection('events').doc();const batch=db.batch();batch.update(ref,data);batch.set(ev,{at:firebase.firestore.FieldValue.serverTimestamp(),byUid:user.uid,status:'提出済み',type:'submitted',fileSha256:x.file.sha256});await batch.commit();toast('請求書を提出しました')}catch(e){console.warn(e);toast('請求書を提出できませんでした')}}
  async function createRevision(iid){const x=invoices.find(v=>v.id===iid);if(!x||x.status!=='差戻し')return;const authorization=activeAuthorization(x.month),version=Number(x.version||1)+1;if(!authorization||authorization.id!==x.authorizationId||Number(authorization.revision)!==Number(x.authorizationRevision)||Number(authorization.invoiceVersion)!==version||!authorization.invoiceDocumentId)return toast('報酬確定内容が更新されています。管理者へ再確認を依頼してください');const at=now(),nid=authorization.invoiceDocumentId,issueDate=localDate(),data={...x,status:'下書き',file:null,ownerShareStatus:'not_uploaded',submittedAt:null,reviewReason:null,supersedesInvoiceId:x.id,version,invoiceNumber:`${String(x.invoiceNumber||'MC')}-R${version}`,idempotencyKey:`${x.idempotencyKey||x.id}-R${version}`,issueDate,retentionUntil:String(Number(issueDate.slice(0,4))+7)+issueDate.slice(4),createdAt:at,updatedAt:at,history:[{at,by:user.uid,status:'下書き',type:'revision',supersedes:x.id}]};delete data.id;delete data._portalUid;delete data._path;delete data.updatedBy;delete data.paymentScheduledAt;delete data.paidAt;if(DEMO){invoices.unshift({id:nid,...data});render();return toast('修正版の下書きを作成しました')};try{const ref=db.collection('editor_portals').doc(user.uid).collection('editor_invoices').doc(nid),ev=ref.collection('events').doc(),batch=db.batch();batch.set(ref,data);batch.set(ev,{at:firebase.firestore.FieldValue.serverTimestamp(),byUid:user.uid,status:'下書き',type:'revision_created',supersedesInvoiceId:x.id,authorizationId:x.authorizationId,authorizationRevision:Number(x.authorizationRevision)});await batch.commit();toast('修正版の下書きを作成しました')}catch(e){console.warn(e);toast('修正版を作成できませんでした')}}
