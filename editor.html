  function portalWriteBlocked(){if(!portalQuotaCircuitOpen)return false;toast('クラウド接続停止中。再読み込み後に操作してください');return true}

  function guideHtml(){return`<div class="guide-hero"><div class="guide-kicker">EDITOR WORK GUIDE</div><h1>初めての方のための編集者ガイド</h1><p>案件を受ける、日程を伝える、質問する、DM、初稿・修正稿を提出する操作はこのアプリで行います。端末通知をオンにして、アプリ内のDMを見落とさないようにしてください。D確認OK・先方確認中はディレクターまたはオーナーが更新します。編集者派遣案件は、先方OK後の完了だけ担当編集者が実納品日と納品URLを付けて記録します。</p></div>
  <div class="section-title"><h2>最初の1回だけすること</h2><span>所要目安5分</span></div><div class="guide-detail-grid"><section class="card guide-detail"><h2>1. ログイン承認</h2><ol><li>Chatworkの概要からこのアプリを開きます。</li><li>Googleでサインインします。</li><li>「アクセス承認待ち」と出たら、管理者の承認後に再読み込みします。</li></ol><div class="guide-done"><b>完了の目印</b>上部に「案件を探す」「担当案件」などのメニューが表示されます。</div></section><section class="card guide-detail"><h2>2. 請求者設定</h2><ol><li>「請求者設定」を開きます。</li><li>氏名、銀行、支店、口座番号、口座名義を入力します。</li><li>「設定を保存」を押します。</li></ol><div class="guide-warning">適格請求書発行事業者でない場合、登録番号は空欄のままで大丈夫です。</div><div class="actions"><button class="btn primary small" onclick="setView('settings')">請求者設定を開く</button></div></section></div>
  <div class="section-title"><h2>DM通知を必ず設定する</h2><span>最初の1回だけ</span></div><section class="card guide-detail"><h2>PC・スマホ共通：アプリ内で通知を有効にする</h2><ol><li>左メニューの「端末通知」、または「通知」画面の「端末通知を設定」を開きます。</li><li>画面の「通知を有効にする」を押し、OSまたはブラウザの確認画面で「許可」を選びます。</li><li>画面に「この端末で通知を受け取れます」と表示されたことを確認します。</li><li>DMを開き、左メニューの「DM」に赤い件数が表示されることを確認します。これは未読DMの件数です。</li></ol><div class="guide-done"><b>完了の目印</b>この端末の「端末通知」画面が「✓ 設定完了」になります。DMの赤い件数は、DMを開くか「すべて既読」にすると消えます。通知を見ただけでは既読になりません。</div><div class="guide-warning">ロック画面の通知には、DM本文・案件名・クライアント名などの具体的な内容を表示しません。内容は必ずサインイン後のアプリ内で確認してください。</div><div class="actions"><button class="btn primary small" onclick="setView('mobile-setup')">通知設定を開く</button><button class="btn small" onclick="setView('dm')">DMを開く</button></div></section>
  <div class="guide-detail-grid"><section class="card guide-detail"><h2>PC（Chrome / Edge）</h2><ol><li>アプリをChromeまたはEdgeで開きます。</li><li>「端末通知」→「通知を有効にする」を押します。</li><li>許可画面が出ない・拒否した場合は、アドレスバー左のサイト情報から「通知」を「許可」にして、アプリを開き直します。</li><li>アプリアイコンの赤い件数も使う場合は、アドレスバー右側またはブラウザメニューからEditFlowをインストールします。</li></ol><div class="guide-done">ブラウザタブでも端末通知を有効にできます。インストールすると独立したアプリとアイコンを使えます。</div></section><section class="card guide-detail"><h2>Android（Chrome）</h2><ol><li>Chromeでアプリを開き、ブラウザメニューから「アプリをインストール」または「ホーム画面に追加」を選びます。</li><li>ホーム画面に追加されたEditFlowを開きます。</li><li>「端末通知」→「通知を有効にする」を押し、「許可」を選びます。</li><li>届かない場合はAndroidの「設定」→「通知」→「EditFlow（またはChrome）」で通知をオンにします。</li></ol></section><section class="card guide-detail"><h2>iPhone（Safari / ホーム画面）</h2><ol><li>Safariでアプリを開き、共有ボタンから「ホーム画面に追加」を選びます。</li><li>ホーム画面に追加されたEditFlowアイコンから、もう一度アプリを開きます。</li><li>「端末通知」→「通知を有効にする」を押し、「許可」を選びます。</li><li>拒否後はiPhoneの「設定」→「通知」→「EditFlow」で「通知を許可」をオンにして、アプリを開き直します。</li></ol><div class="guide-warning">Safariのタブのままでは設定できません。必ずホーム画面に追加したEditFlowから設定してください。</div></section></div>
  <div class="section-title"><h2>通知が届かない・赤い件数が出ないとき</h2></div><section class="card guide-detail"><ol><li>「端末通知」を開き、「設定完了」になっているか確認します。</li><li>端末の設定でEditFlow（または利用ブラウザ）の通知がオンか確認します。</li><li>省電力モード・集中モード・おやすみモードで通知が止まっていないか確認します。</li><li>アプリを完全に閉じてから、別のメンバーにDMを1件送ってもらい、端末通知とアプリ内の赤い未読件数を確認します。</li><li>端末通知だけ届かず、アプリ内の赤い件数が増える場合は、DM自体は届いています。端末の通知設定を見直してください。</li></ol><div class="guide-warning">送信テストは本番の案件・進捗を変更せず、DMだけで行います。通知が届かない状態のまま業務を進めず、担当ディレクターまたはオーナーへ連絡してください。</div></section>
  <div class="section-title"><h2>毎週月曜日にすること</h2><span>今週の1週間だけ</span></div><section class="card guide-detail"><h2>編集可能スケジュールを登録</h2><ol><li>「スケジュール」を開きます。</li><li>一括登録で対応可能な曜日を選び、時間・受託可能本数・案件種別を入れます。</li><li>毎週同じなら「毎週のルーティン」をオンにします。</li><li>「今週の1週間を保存」を押します。</li></ol><div class="guide-done"><b>完了の目印</b>今週の月曜日から日曜日のカレンダーに入力内容が残ります。</div><div class="guide-warning">他の編集者も見るため、通院・家族・私用などの理由は入力しません。</div><div class="actions"><button class="btn primary small" onclick="setView('schedule')">スケジュールを開く</button></div></section>
  <div class="section-title"><h2>案件を受ける2つの方法</h2></div><div class="guide-map"><section class="card"><h2>編集代行案件を受ける</h2><ol><li>社内アプリへログインします。</li><li>「案件を探す」を開きます。</li><li>案件内容・初稿日・納期（予定）を確認します。</li><li>「この案件を受ける」を押します。</li><li>自動で開く「担当案件」に反映されたことを確認します。</li></ol><button class="btn primary small" onclick="setView('board')">案件を探す</button></section><section class="card"><h2>編集者派遣の案件を登録する</h2><p>派遣先クライアントから直接受けた案件は、「担当案件」の登録欄でクライアントを選びます。アカウント名は、その案件で必要な場合だけ選択します。子案件ごとに案件名・編集者支払額・指示を入力してください。クライアントを選ぶと、該当するマニュアルが案件へ自動で付きます。納品日は登録時には入力せず、先方OK後に実納品日と納品URLを記録して完了にします。</p><button class="btn primary small" onclick="setView('jobs')">担当案件を開く</button></section></div>
  <div class="section-title"><h2>案件を受けた後の順番</h2></div><section class="card guide-detail"><h2>作業開始から完了まで</h2><div class="guide-status-line"><span class="pill">アサイン済み</span><span class="guide-arrow">→</span><span class="pill">編集者進行中</span><span class="guide-arrow">→</span><span class="pill amber">初稿提出済み</span><span class="guide-arrow">→</span><span class="pill amber">修正中</span><span class="guide-arrow">→</span><span class="pill amber">修正稿提出済み</span><span class="guide-arrow">→</span><span class="pill green">D確認OK</span><span class="guide-arrow">→</span><span class="pill green">先方確認中</span><span class="guide-arrow">→</span><span class="pill green">完了</span></div><p class="muted">「進行中」は、mono.create内で案件を進める場合にディレクターまたはオーナーが使用します。</p><ol><li>案件を開き、納期・編集指示・素材URL・マニュアルを確認します。</li><li>アサイン済みの案件は「編集を開始」を選び、編集者進行中にします。</li><li>初稿を提出したら「初稿を提出した」を押し、提出した内容のURLを保存します。</li><li>修正稿を提出したら「修正稿を提出した」を押し、提出した内容のURLを更新します。</li><li>進行中・修正中・D確認OK・先方確認中は、ディレクターまたはオーナーが更新します。</li><li>編集代行案件の完了はディレクターまたはオーナー、編集者派遣案件の完了は担当編集者が実納品日と納品URLを付けて更新します。</li></ol><div class="guide-warning">編集者は、編集開始、初稿・修正稿の提出を更新します。編集者派遣案件だけは、先方OK後の完了も担当編集者が記録します。編集代行案件の完了はディレクターまたはオーナーが記録します。先方確認中・修正中・提出済み・D確認OKは期限超過として表示しません。</div></section>
  <div class="section-title"><h2>その他のページ</h2></div><div class="guide-detail-grid"><section class="card guide-detail"><h2>マニュアル</h2><ol><li>作業前に「必読」のマニュアルを開きます。</li><li>案件に自動で付いたクライアント・アカウント別マニュアルを確認します。</li><li>読んだら「読了を記録」を押します。</li></ol><div class="actions"><button class="btn small" onclick="setView('manuals')">マニュアルを開く</button></div></section><section class="card guide-detail"><h2>過去フィードバック</h2><ol><li>Dから修正指示が届いた案件を開きます。</li><li>「過去フィードバックに記録」を押します。</li><li>今回の学び・次回の注意点を短く書いて提出します。</li><li>Dまたはオーナーの承認後、自分向けマニュアルへ反映されます。</li></ol><div class="actions"><button class="btn small" onclick="setView('feedback')">過去フィードバックを開く</button></div></section><section class="card guide-detail"><h2>編集者ランキング</h2><ol><li>毎週の公開後に「編集者ランキング」を開きます。</li><li>納品本数・納期遵守・品質評価・総合点を確認します。</li><li>評価母数が少ない項目は参考値として確認します。</li></ol><div class="actions"><button class="btn small" onclick="setView('ranking')">ランキングを開く</button></div></section><section class="card guide-detail"><h2>匿名目安箱</h2><ol><li>種類を選び、状況と改善してほしい内容を書きます。</li><li>返信が必要なら返信コード発行をオンにします。</li><li>「匿名で送信」を押し、コードを保管します。</li></ol><div class="actions"><button class="btn small" onclick="setView('suggestion')">匿名目安箱を開く</button></div></section><section class="card guide-detail"><h2>請求書</h2><ol><li>案件完了後、管理者が報酬額と対象月を確定するまで待ちます。</li><li>請求対象月と支払期日を確認し、下書きを作成します。</li><li>プレビューで氏名・口座・明細・金額を確認します。</li><li>PDFをDrive保存し、「確定して提出」を押します。</li></ol><div class="guide-done"><b>完了の目印</b>請求書履歴の状態が「提出済み」になります。</div><div class="actions"><button class="btn primary small" onclick="setView('invoices')">請求書を開く</button></div></section></div>
  <div class="section-title"><h2>迷ったとき</h2></div><div class="guide-faq"><div class="card"><b>「システム更新」が届いた</b><span>入力中の内容を保存し、画面を再読み込みします。</span></div><div class="card"><b>案件が見つからない</b><span>「案件を探す」と「担当案件」の両方を確認します。ない場合は担当登録待ちです。</span></div><div class="card"><b>クライアントの選択肢がない</b><span>管理者が対象クライアントを共有すると表示されます。アカウント名は必要な案件だけ選び、不要なら空欄で登録できます。</span></div><div class="card"><b>初稿・修正稿を提出したい</b><span>案件の詳細を開き、「初稿を提出した」または「修正稿を提出した」を押します。提出した内容のURLも入力します。</span></div><div class="card"><b>請求書が作れない</b><span>管理者の報酬確定後に作成できます。確定済みでも作れない場合は、請求者設定の必須項目を確認します。</span></div></div>`}

  async function googleLogin(method='popup'){
    if(authInFlight)return;
    if(isEmbeddedAuthBrowser()){authUiState={busy:false,message:'この画面ではGoogleサインインが止まることがあります。SafariまたはChromeで開いてください。',kind:'warn',browserHelp:true,startupError:false};loginScreen();return}
    if(!auth)return renderAuthRecovery();
    if(auth.currentUser){user=auth.currentUser;portalAuthLoadingScreen();return}
    const useRedirect=method==='redirect'&&canUseRedirectAuth();
    authInFlight=true;const attempt=++authAttempt,button=$('#google-login-button');
    if(button){button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='Googleの画面を確認中…'}
    authUiState={busy:true,message:'Googleのサインイン画面で、使用するアカウントを選んでください。',kind:'',browserHelp:false,startupError:false};
    try{
      const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
      if(useRedirect){
        authUiState={busy:true,message:'Googleのサインイン画面へ移動します…',kind:'',browserHelp:false,startupError:false};loginScreen();
        await auth.signInWithRedirect(provider);
        return;
      }
      const popup=auth.signInWithPopup(provider);loginScreen();
      await withAuthTimeout(popup);
      if(attempt===authAttempt&&!user){authUiState={busy:true,message:'サインインできました。登録情報を確認しています…',kind:'',browserHelp:false,startupError:false};loginScreen()}
    }catch(error){
      if(attempt===authAttempt&&!user){const state=authErrorMessage(error);authUiState={busy:false,startupError:false,...state};loginScreen()}
    }finally{
      if(attempt===authAttempt){authInFlight=false;const current=$('#google-login-button');if(current){current.disabled=false;current.setAttribute('aria-busy','false')}}
    }
  }

    finally{if(button)button.disabled=false}

  async function generateInvoicePdf(x){

    if(typeof window.html2canvas!=='function'||!window.jspdf?.jsPDF)throw new Error('PDF library unavailable');
    const frame=document.createElement('iframe');
    frame.setAttribute('aria-hidden','true');
    frame.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;opacity:0;pointer-events:none';
    const loaded=waitForFrame(frame);
    frame.srcdoc=invoiceDocument(x);
    document.body.appendChild(frame);
    try{
      await loaded;
      const doc=frame.contentDocument,source=doc?.body;
      if(!source)throw new Error('invoice document unavailable');
      if(doc.fonts?.ready)await doc.fonts.ready;
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      const sourceWidth=Math.max(794,source.scrollWidth,doc.documentElement.scrollWidth);
      const sourceHeight=Math.max(source.scrollHeight,doc.documentElement.scrollHeight,1123);
      const canvas=await window.html2canvas(source,{backgroundColor:'#ffffff',scale:2,useCORS:false,logging:false,width:sourceWidth,height:sourceHeight,windowWidth:sourceWidth,windowHeight:sourceHeight,scrollX:0,scrollY:0});
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
      const pageWidthMm=190,pageHeightMm=277;
      const pageHeightPx=Math.floor(canvas.width*pageHeightMm/pageWidthMm);
      const bodyRect=source.getBoundingClientRect();
      const avoidBreaks=[...source.querySelectorAll('tr,.box')].map(el=>{const r=el.getBoundingClientRect();return{top:Math.max(0,Math.round((r.top-bodyRect.top)*2)),bottom:Math.round((r.bottom-bodyRect.top)*2)}});
      let top=0,page=0;
      while(top<canvas.height){
        let bottom=Math.min(canvas.height,top+pageHeightPx);
        if(bottom<canvas.height){const crossing=avoidBreaks.find(r=>r.top<bottom&&r.bottom>bottom&&r.top>top+120);if(crossing)bottom=crossing.top}
        if(bottom<=top)bottom=Math.min(canvas.height,top+pageHeightPx);
        const part=document.createElement('canvas');part.width=canvas.width;part.height=bottom-top;
        const ctx=part.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,part.width,part.height);ctx.drawImage(canvas,0,top,canvas.width,bottom-top,0,0,part.width,part.height);
        if(page++)pdf.addPage();
        pdf.addImage(part.toDataURL('image/jpeg',0.96),'JPEG',10,10,pageWidthMm,(part.height/canvas.width)*pageWidthMm,undefined,'FAST');
        top=bottom;
      }
      return pdf.output('blob');
    }finally{frame.remove()}
  }
