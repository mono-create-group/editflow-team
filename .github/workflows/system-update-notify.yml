name: Notify editor app system update

on:
  push:
    branches: [main]
    paths:
      - index.html
      - editor.html
      - editor-features.js
      - manager-features.js
      - sw.js
  workflow_dispatch: # 失敗・停止した同一版の固定通知を、重複防止付きで再実行する

permissions:
  contents: read

concurrency:
  group: editor-app-system-update
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(sed -n "s/.*const APP_VERSION='\([^']*\)'.*/\1/p" index.html | tail -1)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Notify existing Chatwork room after Pages is live
        # 会長承認済みの限定例外: 公開完了後の固定システム更新通知は都度確認なしで自動送信する。
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_SYSTEM_UPDATE_ROOM_IDS: ${{ secrets.CHATWORK_SYSTEM_UPDATE_ROOM_IDS }}
        run: python3 scripts/notify-system-update.py --version "${{ steps.version.outputs.value }}"
