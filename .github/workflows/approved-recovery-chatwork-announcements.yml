name: Send approved Chatwork recovery announcements

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-recovery-chatwork-announcements
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send exactly the approved recovery announcements
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
        run: python3 scripts/notify-recovery-announcements.py --send
