<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編集受付・社内統合 fixture</title><style>body{margin:0;font:15px sans-serif;background:#f6f7fa;color:#263148}header{background:white;border-bottom:1px solid #ddd;padding:18px 24px}#controls{padding:12px;display:flex;gap:12px;flex-wrap:wrap}button{padding:10px;font:inherit}#view{padding:20px;max-width:1500px;margin:auto}#outside{color:rgb(11,22,33);font-size:19px}#evidence{overflow-wrap:anywhere;white-space:pre-wrap;font-size:12px;margin:12px}</style><header>mono.create 社内アプリ — fixture 限定</header><div id="controls"><button id="open">編集受付</button><button id="leave">画面を離れる</button><button id="revoke">非オーナーに切り替え</button><button id="owner">オーナーに戻す</button></div><p id="outside">外側のスタイル・フォームは変えません</p><div id="view"></div><pre id="evidence"></pre>
<script>
let owner=true,tokenCalls=0;const calls=[];const user={uid:'synthetic-owner',getIdToken:async()=>{tokenCalls++;return 'fixture-only-token';}};
const order={listSummary:true,id:'order_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',customerId:'fixture-customer',customerName:'検証用のお客様',revision:0,status:'inquiry',createdAt:'2026-09-30T00:00:00.000Z',updatedAt:'2026-09-30T00:00:00.000Z',title:'架空の動画 1',videoCount:10,latestQuoteTotalYen:null,dueDate:null,progressStage:0,nextAction:'相談内容を確認しています',adminTask:{category:'action',label:'相談内容を確認して見積もりを作成'}};
window.fetch=async(url,options)=>{calls.push({url,credentials:options.credentials,authorization:options.headers.Authorization});if(!url.startsWith('https://mono-editing-intake.mono-create-group.workers.dev/api/internal-admin/'))throw Error('Fixture rejected URL');if(options.credentials!=='omit'||options.headers.Authorization!=='Bearer fixture-only-token')throw Error('Fixture rejected authentication');const route=new URL(url).pathname.replace('/api/internal-admin','');let data;if(route==='/config')data={mode:'fixture',adminNotificationsAvailable:false,lineLoginAvailable:false};else if(route==='/session')data={user:{id:'synthetic-owner',role:'admin'},csrfToken:null};else if(route==='/orders')data={orders:[order],total:1,nextCursor:null,counts:{all:1,action:1,waiting:0,working:0,done:0}};else throw Error('Fixture rejects unknown operation');document.getElementById('evidence').textContent=JSON.stringify({requests:calls.length,tokenCalls,lastRoute:route,remoteRequests:0});return {ok:true,status:200,json:async()=>data};};
</script><script src="../editing-intake-integration.js"></script><script>
function open(){document.getElementById('view').innerHTML='<div id="placeholder"></div>';void EditflowEditingIntake.renderInto(document.getElementById('placeholder'),{getUser:()=>owner?user:null,isOwner:()=>owner,onClose:leave});}function leave(){EditflowEditingIntake.stop();document.getElementById('view').textContent='別の社内画面';}document.getElementById('open').onclick=open;document.getElementById('leave').onclick=leave;document.getElementById('revoke').onclick=()=>{owner=false;EditflowEditingIntake.stop();open();};document.getElementById('owner').onclick=()=>{owner=true;open();};open();
</script></html>
