<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>納品・目標 3区分表示確認</title>
  <link rel="stylesheet" href="../app-ui.css">
  <link rel="stylesheet" href="../owner-yellow-ui.css">
  <style>
    :root{--card:#fff;--card2:#f8fafc;--border:#e2e8f0;--text:#172033;--t2:#64748b;--t3:#94a3b8;--purple:#7c3aed;--pdim:#f5f3ff;--green:#16a34a;--shadow-lg:0 16px 50px rgba(15,23,42,.12)}
    *{box-sizing:border-box}body{margin:0;padding:28px;background:#f6f7fb;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.muted{color:var(--t2)}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}.ph{display:flex;justify-content:space-between;margin-bottom:18px}.ph-title{font-size:28px;font-weight:900}.actions{display:flex;gap:8px;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800}.notice{padding:10px;border-radius:8px;background:#fff7ed;color:#9a3412}.owner-performance-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.owner-performance-cards article{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}.owner-performance-cards article>div{font-size:20px;font-weight:900;margin-top:6px}.owner-performance-cards small{color:var(--t2);line-height:1.6}.owner-video-performance .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.owner-video-performance label{display:grid;gap:5px;font-size:12px;font-weight:800}.owner-video-performance input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:#fff}.owner-goal-category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.owner-goal-category{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}.owner-goal-category h4{margin:0 0 3px;font-size:15px}.owner-goal-category>p{margin:0 0 10px;color:var(--t2);font-size:11px}.owner-goal-category input{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.owner-goal-total{display:grid;grid-template-columns:minmax(110px,1fr) repeat(2,minmax(120px,auto));gap:10px;align-items:center;background:linear-gradient(135deg,var(--pdim),var(--card2));border:2px solid var(--purple);border-radius:12px;padding:14px 16px;margin:12px 0}.owner-goal-total>span{font-size:14px;font-weight:900}.owner-goal-total>b{font-size:20px;text-align:right;font-variant-numeric:tabular-nums}.owner-goal-total small{grid-column:1/-1;color:var(--t2)}
    @media(max-width:900px){.owner-goal-category-grid{grid-template-columns:1fr}.owner-goal-category .form-grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){body{padding:12px}.owner-performance-cards{grid-template-columns:1fr 1fr}.owner-video-performance .form-grid,.owner-goal-category .form-grid{grid-template-columns:1fr}.owner-goal-total{grid-template-columns:1fr 1fr}.owner-goal-total>span,.owner-goal-total small{grid-column:1/-1}.owner-goal-total>b{text-align:left}}
  </style>
</head>
<body>
  <main id="preview"></main>
  <script>
    window._isOwner=()=>true;
    window.FB_USER={email:'mono.create.group@gmail.com'};
    window.S={jobs:[]};window.PORTAL_JOBS=[];window.SELF_WID='__self';window.toast=()=>{};
    const goal={month:'2026-09',active:true,internalTargetCount:10,internalTargetAmount:50000,agencyTargetCount:20,agencyTargetAmount:20000,dispatchTargetCount:5,dispatchTargetAmount:30000,targetCount:35,targetAmount:100000};
    const snap=(exists,data,id='')=>({exists,id,data:()=>data,docs:[]});
    window.fbDb={collection(name){return{doc(id){return{onSnapshot(ok){queueMicrotask(()=>ok(name==='owner_delivery_goals'?snap(true,goal,id):snap(false,null,id)));return()=>{}}}},where(){return{onSnapshot(ok){queueMicrotask(()=>ok(snap(false,null)));return()=>{}}}}}}};
  </script>
  <script src="../owner-video-performance.js"></script>
  <script>
    EditflowOwnerPerformance.renderPage(document.getElementById('preview'),{today:'2026-09-01',month:'2026-09',weekStart:'2026-08-31',finance:[],sourcesReady:true});
  </script>
</body>
</html>
