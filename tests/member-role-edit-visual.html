<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>メンバー権限編集 表示確認</title>
  <style>
    body{margin:0;background:#f4f5fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
    main{max-width:820px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e4e6f0;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(20,23,45,.07)}
    h1{font-size:21px;margin:0 0 6px}.lead{font-size:12px;color:#6b7280;margin-bottom:16px}.member{display:flex;align-items:center;gap:10px;padding:12px;background:#f4f4fb;border-radius:11px;margin-top:8px}.member-info{flex:1;min-width:0}.member-name{font-weight:750}.member-meta{font-size:11px;color:#8492aa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;gap:6px}.btn{min-height:36px;padding:7px 12px;border:1px solid #dfe2ed;border-radius:9px;background:#fff;color:#172033;font-weight:750;cursor:pointer}.btn.primary{background:#6d3df5;color:#fff;border-color:#6d3df5}.btn.danger{color:#dc2626}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border-radius:18px;padding:20px}.mhdr,.mfooter{display:flex;align-items:center;gap:8px}.mhdr{justify-content:space-between;margin-bottom:18px}.mtitle{font-size:18px;font-weight:850}.mail{font-size:11px;color:#8492aa}.fg{margin:14px 0}.fl{font-size:11px;font-weight:750;color:#64748b;margin-bottom:5px}input[type="text"],select{width:100%;box-sizing:border-box;padding:10px 11px;border:1px solid #dfe2ed;border-radius:9px;font:inherit}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.role{display:flex;gap:7px;align-items:center;padding:10px;border:1px solid #e2e4ed;background:#f7f7fb;border-radius:9px;font-size:12px;font-weight:650}.mfooter{margin-top:18px}.spacer{flex:1}.saved{margin-top:12px;padding:9px 11px;border-radius:9px;background:#dcfce7;color:#166534;font-size:12px;font-weight:750;display:none}
    @media(max-width:520px){main{padding:14px 10px}.member{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.roles{grid-template-columns:1fr}.modal{padding:16px}.mfooter{flex-wrap:wrap}.mfooter .btn{flex:1}.mfooter .danger{flex-basis:100%}.spacer{display:none}}
  </style>
</head>
<body>
  <main><div class="card"><h1>サインインしたメンバー・権限</h1><div class="lead">登録後も「編集」から、名前・役割・担当者を変更できます。</div><div class="member"><div class="member-info"><div class="member-name" id="row-name">テストメンバー</div><div class="member-meta" id="row-meta">member@example.com ・ 動画編集ディレクター ・ テスト担当者</div></div><div class="actions"><button class="btn" onclick="openEditor()">編集</button><button class="btn danger">削除</button></div></div></div></main>
  <div class="overlay" id="editor" hidden><div class="modal"><div class="mhdr"><div><div class="mtitle">メンバー権限を編集</div><div class="mail">member@example.com</div></div><button class="btn" onclick="closeEditor()">閉じる</button></div><div class="fg"><div class="fl">表示名</div><input id="name" type="text" value="テストメンバー"></div><div class="fg"><div class="fl">役割（複数選択可）</div><div class="roles"><label class="role"><input type="checkbox" value="動画編集者">動画編集者</label><label class="role"><input type="checkbox" value="動画編集ディレクター" checked>動画編集ディレクター</label><label class="role"><input type="checkbox" value="AIコンサルタント">AIコンサルタント</label><label class="role"><input type="checkbox" value="AIエンジニア">AIエンジニア</label><label class="role"><input type="checkbox" value="Webデザイナー">Webデザイナー</label><label class="role"><input type="checkbox" value="営業">営業</label><label class="role"><input type="checkbox" value="SNSマーケター">SNSマーケター</label></div></div><div class="fg"><div class="fl">担当編集者</div><select id="worker"><option>担当者を紐付けない</option><option selected>テスト担当者</option></select></div><div class="mfooter"><button class="btn danger">削除</button><span class="spacer"></span><button class="btn" onclick="closeEditor()">キャンセル</button><button class="btn primary" onclick="saveEditor()">変更を保存</button></div><div class="saved" id="saved">メンバーの権限を変更しました</div></div></div>
  <script>
    function openEditor(){document.getElementById('editor').hidden=false}
    function closeEditor(){document.getElementById('editor').hidden=true}
    function saveEditor(){const roles=[...document.querySelectorAll('.role input:checked')].map(x=>x.value);document.getElementById('row-name').textContent=document.getElementById('name').value;document.getElementById('row-meta').textContent=`member@example.com ・ ${roles.join(' / ')}`;document.getElementById('saved').style.display='block'}
  </script>
</body>
</html>
