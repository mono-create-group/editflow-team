<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新規編集者の承認画面</title>
  <style>
    :root{color-scheme:light;--bg:#f7f7f5;--card:#fff;--card2:#fafaf8;--border:#deded8;--text:#20201d;--t2:#66645e;--t3:#8a8881;--yellow:#ffc400}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:24px}.page{max-width:1180px;margin:auto}.card{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(32,32,29,.05)}.count{font-size:13px;font-weight:800;margin-bottom:10px}.request{padding:14px;background:var(--card2);border:1px solid var(--border);border-radius:10px}.name{font-size:16px;font-weight:800}.email{font-size:12px;color:var(--t3);margin:3px 0 11px}.roles{display:flex;gap:7px;flex-wrap:wrap}.roles label{font-size:12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field span{font-size:11px;font-weight:800;color:var(--t2)}select{width:100%;min-width:0;padding:11px 12px;border:1px solid #bdbbb3;border-radius:9px;background:#fff;color:var(--text);font-size:14px}.hint{font-size:12px;line-height:1.65;color:var(--t3);margin-top:8px}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid var(--border);border-radius:9px;background:#fff;padding:10px 18px;font-weight:800;font-size:14px}.btn.primary{background:var(--yellow);border-color:var(--yellow)}
    @media(max-width:700px){body{padding:12px}.card{padding:12px}.fields{grid-template-columns:1fr}.roles{display:grid;grid-template-columns:1fr 1fr}.btn{min-height:44px;flex:1}.actions{position:sticky;bottom:8px;background:rgba(250,250,248,.94);padding-top:8px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="count">承認待ち 1件</div>
      <article class="request">
        <div class="name">新規 編集者</div>
        <div class="email">new-editor@example.com</div>
        <div class="roles" aria-label="役割">
          <label><input type="checkbox" checked> 動画編集者</label>
          <label><input type="checkbox"> 動画編集ディレクター</label>
          <label><input type="checkbox"> AIコンサルタント</label>
          <label><input type="checkbox"> AIエンジニア</label>
          <label><input type="checkbox"> Webデザイナー</label>
          <label><input type="checkbox"> 営業</label>
          <label><input type="checkbox"> SNSマーケター</label>
        </div>
        <div class="fields">
          <label class="field"><span>編集者の登録方法</span><select><option selected>申請者を新しい編集者として登録（トライアル）</option><optgroup label="既存編集者へ紐付け（引き継ぎ）"><option>三浦大陸</option></optgroup></select></label>
          <label class="field"><span>所属・契約区分</span><select><option selected>mono.create直接編集者</option><option>ディレクター配下の外部編集者</option></select></label>
          <label class="field"><span>担当ディレクター</span><select disabled><option>担当ディレクターを選択</option></select></label>
        </div>
        <div class="hint">新規登録は申請時のChatwork表示名で編集者台帳へ追加します。引き継ぎの場合だけ既存編集者を選んでください。外部編集者は担当ディレクターも必須です。</div>
        <div class="actions"><button class="btn primary">承認</button><button class="btn">却下</button></div>
      </article>
    </section>
  </main>
</body>
</html>
